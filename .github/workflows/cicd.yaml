name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: devops-bootcamp-app

jobs:

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout source code
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

            # -----------------------------------------------------
      # Debug GitHub OIDC claims
      # -----------------------------------------------------

      - name: Debug GitHub OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          response=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          token=$(echo "$response" | jq -r '.value')

          payload=$(echo "$token" | cut -d '.' -f 2)

          # Fix base64 padding
          payload="${payload}$(printf '%*s' $((4 - ${#payload} % 4)) '' | tr ' ' '=')"

          echo "$payload" | base64 -d 2>/dev/null | jq '{
            sub,
            aud,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref
          }'

      # -----------------------------------------------------
      # Configure AWS using GitHub OIDC
      # -----------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::990723917403:role/devops-github-actions-role
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------
      # Login to Amazon ECR
      # -----------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # -----------------------------------------------------
      # Set Docker image
      # -----------------------------------------------------

      - name: Set image URI
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "image=$REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


      # -----------------------------------------------------
      # Build Docker image
      # -----------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.image }}" \
            ./app


      # -----------------------------------------------------
      # Push Docker image to ECR
      # -----------------------------------------------------

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.image }}"