services:
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /etc/cloudflared/tunnel-token
    volumes:
      - ./tunnel-token:/etc/cloudflared/tunnel-token:ro
    restart: unless-stopped


volumes:
  grafana-data:
