- name: Naikkan stack pemantauan
  hosts: monitoring
  become: true
  vars:
    docker_users:
    - ubuntu
    - ssm-user
  roles:
    - geerlingguy.docker
  tasks:
    - name: Cipta folder stack
      file:
        path: /opt/monitoring
        state: directory

    - name: Hantar prometheus.yaml
      copy:
        src: ../Monitoring/prometheus.yaml
        dest: /opt/monitoring/prometheus.yaml

    - name: Hantar compose.yaml
      copy:
        src: ../Monitoring/compose.yaml
        dest: /opt/monitoring/compose.yaml

    - name: Naikkan container
      command: docker compose up -d prometheus grafana
      args:
        chdir: /opt/monitoring