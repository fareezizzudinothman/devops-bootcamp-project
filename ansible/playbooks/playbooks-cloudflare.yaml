- name: Configure Cloudflare Tunnel
  hosts: monitoring
  become: true

  tasks:

    - name: Download AWS CLI v2
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"

    - name: Install unzip
      apt:
        name: unzip
        state: present
        update_cache: true

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/aws/install

    - name: Install AWS CLI v2
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws

        

    - name: Ambil tunnel token dari AWS SSM
      shell: >
        aws ssm get-parameter
        --name "/devops-bootcamp-2026/tunnel-token"
        --with-decryption
        --query "Parameter.Value"
        --output text
      register: tunnel_token
      no_log: true
      changed_when: false

    - name: Simpan tunnel token
      copy:
        content: "{{ tunnel_token.stdout }}"
        dest: /opt/monitoring/tunnel-token
        owner: root
        group: root
        mode: "0444"
      no_log: true

    - name: Start Cloudflare Tunnel
      command: docker compose -f compose.yaml up -d cloudflared
      args:
        chdir: /opt/monitoring